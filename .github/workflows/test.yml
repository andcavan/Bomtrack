# La suite gira senza una sola dipendenza: nessun `npm install`, nessuna cache,
# solo Node e i file del repo. Serve a impedire che una modifica arrivi su main
# con i test rossi — finora l'unica verifica era ricordarsi di lanciarli a mano.
name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Un Postgres vero per test/schema-sql.test.js: carica supabase/schema.sql,
    # ci spinge dentro un database intero e prova invio, lettura e vincoli.
    # Senza BOMTRACK_PG quei test si dichiarano saltati e il resto gira uguale.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      BOMTRACK_PG: host=localhost port=5432 user=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # il README chiede Node 18+; qui si prova su una versione più recente
      - name: Suite di test
        run: node test/run.js
      - name: Benchmark
        # Non fa fallire la build: è una misura, non un limite. Il numero resta
        # nel log per confrontarlo con quello della versione precedente.
        run: node test/bench.js
        continue-on-error: true
